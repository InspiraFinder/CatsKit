name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/catskit_keystore.jks
      
      - name: Create signing config
        run: |
          # local.properties 只保留 SDK 路径
          cat > android/local.properties << EOF
          flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.44.1-x64
          sdk.dir=/usr/local/lib/android/sdk
          EOF
          # 签名密码通过 GitHub Secrets 写入 key.properties（该文件不会提交）
          cat > android/key.properties << EOF
          storeFile=catskit_keystore.jks
          keyAlias=catskit_alias
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --split-per-abi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ================= Windows 桌面版构建 =================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Get version info
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "CatsKit-windows-${{ steps.version.outputs.TAG }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: CatsKit-windows-*.zip
          if-no-files-found: error

  # ================= iOS 未签名 IPA 构建 =================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      # macOS 自带 CocoaPods；若缺失则安装，保证 pod install 可用
      - name: Ensure CocoaPods
        run: |
          pod --version >/dev/null 2>&1 || sudo gem install cocoapods --no-document

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package unsigned IPA
        run: |
          # 未签名 IPA 结构：Payload/Runner.app 打包为 zip
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "CatsKit-ios-${{ steps.version.outputs.TAG }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CatsKit-ios-*.ipa
          if-no-files-found: error

  # ================= Linux 桌面版构建 =================
  # 用 ubuntu-22.04 而非 ubuntu-latest：产物最低要求 glibc 跟随构建机版本，
  # 22.04 → glibc 2.35，兼容 Ubuntu 22.04 及以上；若该 runner 下线，改回 ubuntu-latest 即可
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Flutter Linux 桌面版依赖 GTK3 开发库与构建工具
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package Linux build
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/CatsKit-linux-x64-${{ steps.version.outputs.TAG }}.tar.gz" bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: CatsKit-linux-*.tar.gz
          if-no-files-found: error

  # ================= 统一发布 Release（等待 Android + Windows + iOS + Linux 构建完成） =================
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios, build-linux]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "CatsKit ${{ steps.version.outputs.TAG }}"
          prerelease: false
          body: |
            ## 正式版 - ${{ steps.version.outputs.TAG }}
              - 发布日期：${{ steps.version.outputs.DATE }}

              ### 🎉 本次更新（2.3.3）
              - **同步国际服 10-15 平衡性调整（两次）** —— 部件数据库已更新：
                **蝙蝠** ATK 8,000 → **9,000**（+12.5%）、**等离子哨兵** ATK 4,500 → **5,400**（+20%）；
                **口香糖枪**当天先被调整（电力 15 → 10、ATK 10,920 → 8,500），
                但在同一天的**第二次调整中调回原值**，所以数据不变
              - **仅国际服生效** —— 上述两个部件在国服**保持原值**（8,000 / 4,500），
                不会被国际服数据带跑
              - **修掉「历史平衡」打开全白的问题** —— 页面在横向滚动区里给「备注条目」
                用了 `Expanded`，宽度不受约束会直接让整页布局失败（异常：
                `RenderFlex children have non-zero flex but incoming width constraints are unbounded`），
                表现就是进去一片空白；已改成与其他行一致的固定宽度
              - **「历史平衡」补上武器 ATK 字段** —— 该模块以前只有 HP / 电力 / 插槽 / 备注，
                现在能正确显示武器的 **ATK** 调整（本次两条就是如此记录的）；
                没有净变化的「口香糖枪」以备注条目记在同一天的批次里

              ### 📌 2.3.2 更新回顾
              - 「熔铸计算」融合扣的钱改成「被融合那一件（材料）自己的」花费，与游戏一致
              - 「融合需要」统一改名为「被融合需要」（部件卡 / 材料行 / 弹窗 / 机制指南）
              - 部件卡等级行改成 `188/288`（本级经验条的具体数值：已积累 / 总长）

              ### 📌 2.3.1 更新回顾
              - 「熔铸计算」竖屏一屏放得下：材质 / 星级改一行两个下拉框、品质改分段按钮、
                等级与进度换成自绘紧凑滑条；按钮排成一行，编辑部件时只留「取消 + 确定」
              - 「熔铸计算」再简两块：去掉「部位」选项；工具箱只统计数量
                （不再区分生命值 / 攻击力 / 电力 / 魔法）
              - 去掉融合 / 融工具箱 / 猫生重开的结果类提示条（报错类保留）
              - 删掉设置里早就断线的「显示操作提示」开关
              - 修掉 Windows 上刷屏的 `Failed to update ui::AXTree`（Material `Slider` 内置
                `OverlayPortal` 触发，全部换成自绘 `MiniSlider`）

              ### 📚 功能说明（含 2.2.0 ~ 2.3.3 已发布内容）

              ### 📊 赛季统计（帮派功能 → 赛季统计）
              把每场城市之王的战绩记成一张可查询的表格，赛季结束时归档，方便长期追踪。

              - **表格字段**：场次 / 对战（敌方 ID）/ 开始 / 结束 / 持续 / 间隔 / 战斗分 /
                赛前胜场 / 赛后胜场 / 系数 / 本场得分（列顺序可自定义）
              - **结算系数自动算**：按「本场之前的胜场数」分档 —— 0-1 胜 ×1、2-3 ×2、4-5 ×3、
                6-8 ×4、9-11 ×5、12-15 ×6、16-19 ×8、20-24 ×10、25-29 ×15、30 及以上 ×20；
                本场得分 = 战斗分 × 系数
              - **搜索**：先选搜什么 —— 「对方」用搜索框按敌方 ID 找，「时间」输入起始 / 结束时间
                找某个时间段内的战斗（另有今天 / 近 7 天 / 近 30 天快捷填充）
              - **赛季归档**：赛季结束时填个名字（如「第 1 赛季」「2026-09 赛季」）归档，
                归档后当前表格清空、新赛季从第 1 场重新开始；归档可重命名 / 备注 / 取回 / 删除
              - **跨赛季查询**：赛季选择条里选「全部赛季」，表格会多一列「赛季」，
                每个赛季的场次各自从 1 开始编号
              - **文件导入导出**：导出 JSON（可再导入回 App）+ TSV（Excel 可直接打开）；
                导入时可选「追加到当前赛季 / 作为归档导入 / 替换全部数据」
              - 表格支持点表头排序、行内编辑删除、一键复制整张表

              ### ⏱️ 「时间计算」增强
              - 新增「截图时间」：处理旧截图时可以改，开始 / 结束时间会跟着重算；
                改时间不用日期选择器，直接「-1 天 / +1 天」按钮 + 时 / 分输入框
              - 新增「敌方帮派名称」输入框，导入赛季统计时会写进「对战」列
              - 结算结果下方新增「导入赛季统计」，两个按钮：
                **新增**（追加一条）/ **覆盖最近一条**（改错时直接覆盖上一场）

              ### 📖 「机制指南」补充
              - 城市之王新增小节「战斗分数与结算系数」：本场得分怎么算 + 完整的系数分档表
              - 锦标赛战车补齐「融合」：经验 / 金币阶梯、三种价值、被融合需要与出售价、
                25 档工具箱表；武器表的「随从 HP」列修正为与耗电反向

              ### 🧮 「熔铸计算」
              让部件价值不用再心算：把部件加进来，直接看它值多少、卖多少、融一次花多少。

              - **添加部件**：材质 / 星级 / 品质 / 等级 / 进度（竖屏一屏放得下）
              - **一看就懂的价值**：固有价值、已投入经验、经验价值、未取整的部件金币价值、
                被融合需要、出售可得；等级行直接给本级经验条的数值（如 `188/288`）
              - **直接在工具里融合**：材料从已添加的部件里挑，融合扣的是**材料那一件**的被融合需要
              - **工具箱只统计数量**：记下每个箱子的材质 / 星级，算出融合花费、售价与回收值
              - **技能档位**：专业交易商 / 专业机械师 / 商人
              - 数据存在本机，重开 App 仍在

              ### 📉 「历史平衡」
              记录国际服 / 国服的历次平衡性调整，按日期分组展示（最新在前）。

              - **每行显示**：部件名 / 字段（**ATK**、HP、电力、插槽）/ 变化幅度 / 旧值 → 新值
              - **幅度自动着色**：增 = 绿、减 = 红；电力按绝对差值显示（如 `+5`），其余用百分比
              - 当天有多次调整时用**备注条目**说明（如「先调整、同日又调回原值」）
              - 数据源：`lib/balance_history_data.dart`（与 `lib/parts_data.dart` 的数值保持同步）

              ### 🎨 界面
              - 主界面背景为纯色直角方块贴片（沿用 2.0.0 的构图、去掉方块里的图案），
                跟随深浅色主题调整透明度
              - 设置新增「背景样式」：图案（叠一层低透明度贴片）/ 纯色（只显示背景颜色）
              - 「我的车库」的车位工具栏在国服也会显示「修改名称」
              - 背景图的设计说明与生成脚本一并入库（`assets/patterns/`），可一键重新生成
              - 应用图标重新抠图，修复部分头发被误判为背景的问题

              ### 🎮 猫生重开 2.0 内容回顾
              - **城市之王**：组队后每天挑战同组帮派的 3v3，胜负分按「车辆大小 × 活跃度」结算
              - **帮派联赛**：金 / 银 / 铜 / 木 四组，前 20 晋级、81 名及之后退级，不设容量
              - **封存机制**：成员不足 5 人无法参战；整季未参战不上榜（也就不会被判掉级）
              - **帮派工具包与指挥**：指挥按双方排名决定用几个工具箱，用完从平均值里扣
              - **工具箱掉落**：赛季 25 胜之后每多赢一场额外掉一个生命 / 攻击工具箱
              - **帮派初始数据**：538 个帮派（金 84 / 银 108 / 铜 130 / 木 208）内置在 App 里
              - **赛季结算奖励**：按组内名次与组别系数发放（金 ×4 / 银 ×3 / 铜 ×2 / 木 ×1）
              - **帮派模拟入口**：查看各组的数量、战力、成员、活跃度、工具包与指挥决策分布

              ### 📱 Android 下载安装
              | 文件 | 适用设备 |
              |------|---------|
              | `app-arm64-v8a-release.apk` | 主流手机（推荐） |
              | `app-armeabi-v7a-release.apk` | 老设备 |
              | `app-x86_64-release.apk` | 模拟器 |

              ### 🖥️ Windows 桌面版
              - 下载 `CatsKit-windows-*.zip`，解压后运行 `catskit.exe`
              - ⚠️ Windows 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+（安装时勾选 **Add to PATH**）
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 📱 iOS（未签名 IPA）
              - 下载 `CatsKit-ios-*.ipa`，使用 TrollStore / SideStore / 轻松签等工具安装
              - ⚠️ 未签名 IPA 无法直接安装到未越狱设备，需自签（Apple ID 7 天有效）或使用
                TrollStore（永久）
              - 详细安装方法见项目 README「未签名应用安装指南」

              ### 🐧 Linux 桌面版
              - 下载 `CatsKit-linux-x64-*.tar.gz`，解压后执行 `./catskit`
              - 需要 x86_64 架构（glibc 2.35+，如 Ubuntu 22.04 及以上）与 GTK3 运行库：
                `sudo apt install libgtk-3-0 liblzma5`
              - ⚠️ Linux 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 🔧 系统要求
              - Android 5.0 及以上
              - Windows 10 / 11（64 位）
              - Linux（x86_64，glibc 2.35+，需 GTK3）
              - iOS 15.5 及以上
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}