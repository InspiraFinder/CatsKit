name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/catskit_keystore.jks
      
      - name: Create signing config
        run: |
          # local.properties 只保留 SDK 路径
          cat > android/local.properties << EOF
          flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.44.1-x64
          sdk.dir=/usr/local/lib/android/sdk
          EOF
          # 签名密码通过 GitHub Secrets 写入 key.properties（该文件不会提交）
          cat > android/key.properties << EOF
          storeFile=catskit_keystore.jks
          keyAlias=catskit_alias
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --split-per-abi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ================= Windows 桌面版构建 =================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Get version info
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "CatsKit-windows-${{ steps.version.outputs.TAG }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: CatsKit-windows-*.zip
          if-no-files-found: error

  # ================= iOS 未签名 IPA 构建 =================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      # macOS 自带 CocoaPods；若缺失则安装，保证 pod install 可用
      - name: Ensure CocoaPods
        run: |
          pod --version >/dev/null 2>&1 || sudo gem install cocoapods --no-document

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package unsigned IPA
        run: |
          # 未签名 IPA 结构：Payload/Runner.app 打包为 zip
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "CatsKit-ios-${{ steps.version.outputs.TAG }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CatsKit-ios-*.ipa
          if-no-files-found: error

  # ================= Linux 桌面版构建 =================
  # 用 ubuntu-22.04 而非 ubuntu-latest：产物最低要求 glibc 跟随构建机版本，
  # 22.04 → glibc 2.35，兼容 Ubuntu 22.04 及以上；若该 runner 下线，改回 ubuntu-latest 即可
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Flutter Linux 桌面版依赖 GTK3 开发库与构建工具
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package Linux build
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/CatsKit-linux-x64-${{ steps.version.outputs.TAG }}.tar.gz" bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: CatsKit-linux-*.tar.gz
          if-no-files-found: error

  # ================= 统一发布 Release（等待 Android + Windows + iOS + Linux 构建完成） =================
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios, build-linux]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "CatsKit ${{ steps.version.outputs.TAG }}"
          prerelease: false
          body: |
            ## 正式版 - ${{ steps.version.outputs.TAG }}
              - 发布日期：${{ steps.version.outputs.DATE }}

              ### 📖 新增「机制指南」模块（数据查询 → 机制指南）
              - 文字版 Wiki + 示意图，逐条讲清游戏机制；支持关键词搜索与章节目录一键跳转
              - 后续会持续补充其它玩法的机制说明

              #### 🏙️ 城市之王
              - **战斗怎么打**：一季几场、建筑与车位怎么占、计时结束时按占住的建筑计分
              - **车位争夺**：一辆车怎么打 —— 空闲 / 防守 / 爆炸三种状态，车损与回血怎么算
              - **链接与高回报加成**：链接建筑占满得分 ×n；赛季收尾后某建筑 ×5 持续 2 小时
              - **赛季什么时候结束**：胜负场次决定地区推进，10 个地区全部征服后赛季收官
              - **胜场奖励（工具箱）**：R1~R4 工具箱分别需 1 / 5 / 8 / 10 个地区，加成 +10%~+40%
              - **地区奖励**：每个地区的王牌 / 车轮 / 部件奖励一览表
              - **赛季结算奖励**：金 / 银 / 铜 / 木 四组、各名次区间的自选箱与紫票数量
              - **晋级与退级**：前 20 晋级、81 名及之后退级（金组不再晋级、木组不再退级）
              - **赛季城市与帮派头像**：5 座城市轮换，金 / 银 / 铜前三档的头像样式

              #### 🔧 终极联赛战车
              - 战车由车身 / 武器 / 车轮 / 配件组成，逐项讲清数值是怎么算出来的
              - 部件等级 2~20 级的成长曲线（含旧版 R6 部件的独立成长模式）
              - 整车 HP / ATK 的完整乘区：裸值 → 分类加成 → 额外加成 → 工具箱 → 赞助加成
              - 电力怎么算、出车时五种校验的报错顺序
              - 这些数值在「组车工具」里对应的位置

              ### 🎨 界面
              - 主界面背景改为纯色直角方块贴片（沿用 2.0.0 的构图、去掉方块里的图案），
                跟随深浅色主题调整透明度
              - 背景图的设计说明与生成脚本一并入库（`assets/patterns/`），可一键重新生成
              - 应用图标重新抠图，修复部分头发被误判为背景的问题

              ### 🎮 猫生重开 2.0 内容回顾
              - **城市之王**：组队后每天挑战同组帮派的 3v3，胜负分按「车辆大小 × 活跃度」结算
              - **帮派联赛**：金 / 银 / 铜 / 木 四组，前 20 晋级、81 名及之后退级，不设容量
              - **封存机制**：成员不足 5 人无法参战；整季未参战不上榜（也就不会被判掉级）
              - **帮派工具包与指挥**：指挥按双方排名决定用几个工具箱，用完从平均值里扣
              - **工具箱掉落**：赛季 25 胜之后每多赢一场额外掉一个生命 / 攻击工具箱
              - **帮派初始数据**：538 个帮派（金 84 / 银 108 / 铜 130 / 木 208）内置在 App 里
              - **赛季结算奖励**：按组内名次与组别系数发放（金 ×4 / 银 ×3 / 铜 ×2 / 木 ×1）
              - **帮派模拟入口**：查看各组的数量、战力、成员、活跃度、工具包与指挥决策分布

              ### 📱 Android 下载安装
              | 文件 | 适用设备 |
              |------|---------|
              | `app-arm64-v8a-release.apk` | 主流手机（推荐） |
              | `app-armeabi-v7a-release.apk` | 老设备 |
              | `app-x86_64-release.apk` | 模拟器 |

              ### 🖥️ Windows 桌面版
              - 下载 `CatsKit-windows-*.zip`，解压后运行 `catskit.exe`
              - ⚠️ Windows 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+（安装时勾选 **Add to PATH**）
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 📱 iOS（未签名 IPA）
              - 下载 `CatsKit-ios-*.ipa`，使用 TrollStore / SideStore / 轻松签等工具安装
              - ⚠️ 未签名 IPA 无法直接安装到未越狱设备，需自签（Apple ID 7 天有效）或使用
                TrollStore（永久）
              - 详细安装方法见项目 README「未签名应用安装指南」

              ### 🐧 Linux 桌面版
              - 下载 `CatsKit-linux-x64-*.tar.gz`，解压后执行 `./catskit`
              - 需要 x86_64 架构（glibc 2.35+，如 Ubuntu 22.04 及以上）与 GTK3 运行库：
                `sudo apt install libgtk-3-0 liblzma5`
              - ⚠️ Linux 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 🔧 系统要求
              - Android 5.0 及以上
              - Windows 10 / 11（64 位）
              - Linux（x86_64，glibc 2.35+，需 GTK3）
              - iOS 15.5 及以上
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}