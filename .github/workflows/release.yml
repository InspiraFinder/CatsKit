name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/catskit_keystore.jks
      
      - name: Create signing config
        run: |
          # local.properties 只保留 SDK 路径
          cat > android/local.properties << EOF
          flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.44.1-x64
          sdk.dir=/usr/local/lib/android/sdk
          EOF
          # 签名密码通过 GitHub Secrets 写入 key.properties（该文件不会提交）
          cat > android/key.properties << EOF
          storeFile=catskit_keystore.jks
          keyAlias=catskit_alias
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --split-per-abi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ================= Windows 桌面版构建 =================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Get version info
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "CatsKit-windows-${{ steps.version.outputs.TAG }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: CatsKit-windows-*.zip
          if-no-files-found: error

  # ================= iOS 未签名 IPA 构建 =================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      # macOS 自带 CocoaPods；若缺失则安装，保证 pod install 可用
      - name: Ensure CocoaPods
        run: |
          pod --version >/dev/null 2>&1 || sudo gem install cocoapods --no-document

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package unsigned IPA
        run: |
          # 未签名 IPA 结构：Payload/Runner.app 打包为 zip
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "CatsKit-ios-${{ steps.version.outputs.TAG }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CatsKit-ios-*.ipa
          if-no-files-found: error

  # ================= 统一发布 Release（等待 Android + Windows + iOS 构建完成） =================
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "CatsKit ${{ steps.version.outputs.TAG }}"
          prerelease: false
          body: |
            ## 正式版 - ${{ steps.version.outputs.TAG }}
              - 发布日期：${{ steps.version.outputs.DATE }}

              ### 🎮 猫生重开 2.0（新玩法）
              - **城市之王**：组建/加入帮派后每天挑战同组别帮派的 3v3 对战；胜负分会按双方
                「车辆大小 × 活跃度」的差距结算，单场上限 145000，40 天一赛季
              - **帮派联赛（金/银/铜/木）**：每组 100 名以后按名次升降级（前 20 晋级、
                81 名及之后退级），赛季与城市之王共用 40 天；**不设容量**——每组帮派数量
                每赛季浮动，木组帮派最多（名次一路排到 120 之后）
              - **封存机制**：成员不足 5 人无法参战、整季未参战则不上榜（也就不会被判
                80+ 掉级）；自建帮派可开「禁止加入」并把成员压到 5 人以下主动封存，随时解封复活
              - **帮派工具包与指挥**：帮派有「成员平均工具包」与「指挥水平」两个参数，战斗时
                指挥会参考双方排名决定用几个（对手越强越舍得用、势均力敌用 1 个博一手），
                用完就从平均值里扣；并非所有指挥都能做出最优决策，水平低的会少用/浪费
              - **工具箱掉落**：赛季 25 胜之后每多赢一场额外掉一个生命/攻击工具箱
                （对应部件 +40%，同一部件最多叠 5 层）
              - **帮派初始数据**：538 个帮派（金 84 / 银 108 / 铜 130 / 木 208）的初始名册
                与模拟系统直接内置在 App 里，帮派会长期存在、每赛季小幅浮动
              - **赛季结算奖励**：按组内名次与组别系数发放（金 ×4 / 银 ×3 / 铜 ×2 / 木 ×1）
              - 新增「帮派模拟」入口：帮派页可直接查看各组的数量、战力、成员、活跃度、
                工具包与指挥决策分布

              ### 🎨 界面重做
              - 主菜单改为 **5 个一级选项**（猫生重开置顶、放大为双倍高度；个人功能 / 帮派功能 /
                数据查询 / 通用设置），点击分类即可展开二级模块
              - 主界面与「猫生重开」按钮分别使用两种周期性图案背景（吉祥物水印 / 活动图标，
                都用仓库内素材离线生成，配合深浅色主题）
              - 全新应用图标（自动抠掉背景的透明 PNG），各平台图标（Android 自适应 / iOS /
                macOS / Web / Windows）全部重新生成
              - 「升级计划」等所有车位选择器的车位名称与「我的车库」保持同步

              ### 📱 Android 下载安装
              | 文件 | 适用设备 |
              |------|---------|
              | `app-arm64-v8a-release.apk` | 主流手机（推荐） |
              | `app-armeabi-v7a-release.apk` | 老设备 |
              | `app-x86_64-release.apk` | 模拟器 |

              ### 🖥️ Windows 桌面版
              - 下载 `CatsKit-windows-*.zip`，解压后运行 `catskit.exe`
              - ⚠️ Windows 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+（安装时勾选 **Add to PATH**）
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 📱 iOS（未签名 IPA）
              - 下载 `CatsKit-ios-*.ipa`，使用 TrollStore / SideStore / 轻松签等工具安装
              - ⚠️ 未签名 IPA 无法直接安装到未越狱设备，需自签（Apple ID 7 天有效）或使用
                TrollStore（永久）
              - 详细安装方法见项目 README「未签名应用安装指南」

              ### 🔧 系统要求
              - Android 5.0 及以上
              - Windows 10 / 11（64 位）
              - iOS 15.5 及以上
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}