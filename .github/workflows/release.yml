name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/catskit_keystore.jks
      
      - name: Create signing config
        run: |
          # local.properties 只保留 SDK 路径
          cat > android/local.properties << EOF
          flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.44.1-x64
          sdk.dir=/usr/local/lib/android/sdk
          EOF
          # 签名密码通过 GitHub Secrets 写入 key.properties（该文件不会提交）
          cat > android/key.properties << EOF
          storeFile=catskit_keystore.jks
          keyAlias=catskit_alias
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --split-per-abi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ================= Windows 桌面版构建 =================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Get version info
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "CatsKit-windows-${{ steps.version.outputs.TAG }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: CatsKit-windows-*.zip
          if-no-files-found: error

  # ================= iOS 未签名 IPA 构建 =================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      # macOS 自带 CocoaPods；若缺失则安装，保证 pod install 可用
      - name: Ensure CocoaPods
        run: |
          pod --version >/dev/null 2>&1 || sudo gem install cocoapods --no-document

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package unsigned IPA
        run: |
          # 未签名 IPA 结构：Payload/Runner.app 打包为 zip
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "CatsKit-ios-${{ steps.version.outputs.TAG }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CatsKit-ios-*.ipa
          if-no-files-found: error

  # ================= Linux 桌面版构建 =================
  # 用 ubuntu-22.04 而非 ubuntu-latest：产物最低要求 glibc 跟随构建机版本，
  # 22.04 → glibc 2.35，兼容 Ubuntu 22.04 及以上；若该 runner 下线，改回 ubuntu-latest 即可
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Flutter Linux 桌面版依赖 GTK3 开发库与构建工具
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package Linux build
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/CatsKit-linux-x64-${{ steps.version.outputs.TAG }}.tar.gz" bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: CatsKit-linux-*.tar.gz
          if-no-files-found: error

  # ================= 统一发布 Release（等待 Android + Windows + iOS + Linux 构建完成） =================
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios, build-linux]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "CatsKit ${{ steps.version.outputs.TAG }}"
          prerelease: false
          body: |
            ## 正式版 - ${{ steps.version.outputs.TAG }}
              - 发布日期：${{ steps.version.outputs.DATE }}

              ### 🔧 本次更新（2.2.4）
              - **修复「检测更新」报 HTTP 403** —— 旧版只靠 GitHub 的接口
                （`api.github.com/.../releases/latest`）拿版本号，而该接口对未登录
                调用有**每小时 60 次**的限额，额度用满后一律返回 403。
                现在改为**先用 `github.com/…/releases/latest` 的跳转取版本号**
                （这不是接口，没有次数限制），接口只在拿附件直链时**顺带**试一次；
                即使接口仍不可用，也会按平台拼出附件直链
                （Android `app-arm64-v8a-release.apk` / Windows / iOS / Linux）
              - **附件按平台挑** —— 以前拿的是 release 附件列表里的第一个
                （可能是给别的平台用的），现在按当前平台挑
                （Android 优先 arm64、Windows 认 zip、iOS 认 ipa、Linux 认 tar.gz），
                挑不到再退回通用规则
              - **下载地址回退修正** —— 候选地址返回 403 / 429 / 5xx 时不再直接放弃，
                而是继续试下一个地址；全部失败时才会报错，并带上原因
              - **网络诊断更实用** —— `3a)` 改成真正请求的接口（原来探测的是
                不会受限额影响的 `rate_limit`，接口 403 时诊断却显示 200），
                并显示剩余额度；新增 **`3c)` github.com 跳转** 一项，
                就是 App 现在优先用的取版本号方式
              - **机制指南「锦标赛战车」大幅扩充** —— 车身 / 武器 / 车轮 / 配件四类部件
                现在都按「倍数表 → 基础值表 → 计算式」的同一套结构介绍，四条算式形状一致：
                - **车身 HP** ＝ 向上取整(基础 HP × 0.6 ×(1 + HP 技能)× HP 倍数) + 0.6 × 每级 HP 加成 ×(等级 − 1)
                - **武器 ATK** ＝ 向上取整(基础 ATK × ATK 倍数 ×(1 + 武器伤害技能)) + 0.4 × 每级 ATK 加成 ×(等级 − 1)
                - **车轮 HP** ＝ 向上取整(基础车轮 HP ×(1 + 车轮类别技能)) + 每级 HP 加成 ×(等级 − 1)
                - **配件 HP** ＝ 向上取整(基础车轮 HP ×(1 + 配件 HP 加成)) + 每级 HP 加成 ×(等级 − 1)
                - **治疗量** ＝ 向上取整(基础治疗量 × 2 ×(1 + 配件技能)) + 2 × 每级治疗量加成 ×(等级 − 1)
              - **每级加成拆成两张表** —— 「基础每级加成」（配置原始值 + 加成系数：车身 ×0.6、
                武器 ×0.4、车轮与配件 ×1、治疗量 ×2）与「最终每级加成」（＝ 基础 × 系数）；
                随从（无人机）标注「无数据」
              - **武器 ATK 倍数表** —— 17 件武器一件一行，带 +30% 的 7 件（圆锯 / 火箭 / 双管火箭 /
                激光 / 长钉 / 电钻 / 电锯）额外列出技能 1 / 2 / 3 级的计算值（长钉 0.6154 → 0.8000、
                电钻 0.8547 → 1.1111）；双刃武器 = 单刃 × 2（双头圆锯 0.6600 = 圆锯 0.3300 × 2）
              - **车轮尺寸表** —— 10 款车轮各自的「原档」（小 / 中 / 大）与可能读到的档位
                （旋钮轮 / 滚轮 / 黏地轮·滚轮 / 爬坡轮胎 = 小；滑板轮 / 轱辘轮 / 黏地轮·轱辘轮 /
                悬浮轮胎 / 反重力滑板轮 = 中；大脚轮 = 只有大）
              - **配件** —— 12 种配件只分小 / 中 / 大 3 个数值档（渔网与渔叉同值），
                并附基础值表（＝ 同段同档的基础车轮 HP）与 HP 算式
              - **技能一览** —— 武器 / 车轮 / 配件三套类别技能与各自的解锁段位
              - **术语调整** —— 材质「铁制」更名为「金属」（英文 Metal）、「威望」更名为「威名」

              ### 📌 2.2.3 更新回顾
              - **新增「复制更新日志」按钮** —— 设置里「检测最新更新」右侧新增该按钮：
                检测更新 / 下载更新包**出错时**会自动把日志记下来（错误信息 +
                逐个候选地址的尝试结果与 HTTP 状态 + 版本 / 平台 / 时间），
                点一下即可复制发给开发者；报错提示条里也直接带了「复制日志」，
                重启 App 后日志仍在
              - **「猫生重开」帮派联赛导入真实帮派** —— 新增 10 个固定帮派，
                会按各自的名次区间出现在榜单上：
                金组 365 / 荒原狼 / 361 / 喵星玩具店 / 今晚的森林 / 黎明重工 /
                无敌灰熊 / CHUBBY WOLF / CHUBBY TIGER，木组 树荫下
              - **「猫生重开」废铁行动的决策改为每天 1 次** —— 四档
                （+50 / +100 / +150 / +200）合计每天只能选 1 次，
                与齿轮奔袭 / 全明星保持一致（看广告不受限，次日恢复）
              - **素材授权说明** —— `assets/icon/` 下的图标图片单独采用
                CC BY-NC 4.0（署名—非商业性使用），禁止商用；游戏内素材图片的
                版权归原权利方所有（开发 ZeptoLab、发行 Nazara Technologies
                Limited、中国大陆代理 北京星游无限科技有限公司）

              ### 🛠️ 2.2.2 修复回顾
              - **修复「检查更新 / 下载更新包」失败** —— 2.2.1 及以前，某些网络环境
                下下载会报 `HandshakeException: Connection terminated during
                handshake`。原因是旧逻辑先把域名解析成 IP、再按 IP 连接，而 Dart 的
                HttpClient 无法单独指定 TLS 的 SNI，按 IP 连接时服务器会因为
                SNI 不匹配直接中断握手。现在改为**直接用域名连接**
                （与浏览器一致，握手信息正确），只有系统 DNS 完全不可用时
                才退回 IP 直连兜底
              - **下载地址顺序调整** —— 直连排到「当前配置的备用地址」之后、其它预设
                备用地址之前，能直连 GitHub 的设备不必再等备用地址超时
              - **网络诊断增强** —— 设置里的「检测 DNS 解析和网络连通性」新增
                `3a) 直连域名` 一项（App 实际使用的连接方式），原来的
                「按 IP 直连」降级为 `3b)` 作为对照，排错更直观

              ### 📚 功能说明（含 2.2.0 ~ 2.2.3 已发布内容）

              ### 📊 赛季统计（帮派功能 → 赛季统计）
              把每场城市之王的战绩记成一张可查询的表格，赛季结束时归档，方便长期追踪。

              - **表格字段**：场次 / 对战（敌方 ID）/ 开始 / 结束 / 持续 / 间隔 / 战斗分 /
                赛前胜场 / 赛后胜场 / 系数 / 本场得分（列顺序可自定义）
              - **结算系数自动算**：按「本场之前的胜场数」分档 —— 0-1 胜 ×1、2-3 ×2、4-5 ×3、
                6-8 ×4、9-11 ×5、12-15 ×6、16-19 ×8、20-24 ×10、25-29 ×15、30 及以上 ×20；
                本场得分 = 战斗分 × 系数
              - **搜索**：先选搜什么 —— 「对方」用搜索框按敌方 ID 找，「时间」输入起始 / 结束时间
                找某个时间段内的战斗（另有今天 / 近 7 天 / 近 30 天快捷填充）
              - **赛季归档**：赛季结束时填个名字（如「第 1 赛季」「2026-09 赛季」）归档，
                归档后当前表格清空、新赛季从第 1 场重新开始；归档可重命名 / 备注 / 取回 / 删除
              - **跨赛季查询**：赛季选择条里选「全部赛季」，表格会多一列「赛季」，
                每个赛季的场次各自从 1 开始编号
              - **文件导入导出**：导出 JSON（可再导入回 App）+ TSV（Excel 可直接打开）；
                导入时可选「追加到当前赛季 / 作为归档导入 / 替换全部数据」
              - 表格支持点表头排序、行内编辑删除、一键复制整张表

              ### ⏱️ 「时间计算」增强
              - 新增「截图时间」：处理旧截图时可以改，开始 / 结束时间会跟着重算；
                改时间不用日期选择器，直接「-1 天 / +1 天」按钮 + 时 / 分输入框
              - 新增「敌方帮派名称」输入框，导入赛季统计时会写进「对战」列
              - 结算结果下方新增「导入赛季统计」，两个按钮：
                **新增**（追加一条）/ **覆盖最近一条**（改错时直接覆盖上一场）

              ### 📖 「机制指南」补充
              - 城市之王新增小节「战斗分数与结算系数」：本场得分怎么算 + 完整的系数分档表

              ### 🎨 界面
              - 主界面背景为纯色直角方块贴片（沿用 2.0.0 的构图、去掉方块里的图案），
                跟随深浅色主题调整透明度
              - 背景图的设计说明与生成脚本一并入库（`assets/patterns/`），可一键重新生成
              - 应用图标重新抠图，修复部分头发被误判为背景的问题

              ### 🎮 猫生重开 2.0 内容回顾
              - **城市之王**：组队后每天挑战同组帮派的 3v3，胜负分按「车辆大小 × 活跃度」结算
              - **帮派联赛**：金 / 银 / 铜 / 木 四组，前 20 晋级、81 名及之后退级，不设容量
              - **封存机制**：成员不足 5 人无法参战；整季未参战不上榜（也就不会被判掉级）
              - **帮派工具包与指挥**：指挥按双方排名决定用几个工具箱，用完从平均值里扣
              - **工具箱掉落**：赛季 25 胜之后每多赢一场额外掉一个生命 / 攻击工具箱
              - **帮派初始数据**：538 个帮派（金 84 / 银 108 / 铜 130 / 木 208）内置在 App 里
              - **赛季结算奖励**：按组内名次与组别系数发放（金 ×4 / 银 ×3 / 铜 ×2 / 木 ×1）
              - **帮派模拟入口**：查看各组的数量、战力、成员、活跃度、工具包与指挥决策分布

              ### 📱 Android 下载安装
              | 文件 | 适用设备 |
              |------|---------|
              | `app-arm64-v8a-release.apk` | 主流手机（推荐） |
              | `app-armeabi-v7a-release.apk` | 老设备 |
              | `app-x86_64-release.apk` | 模拟器 |

              ### 🖥️ Windows 桌面版
              - 下载 `CatsKit-windows-*.zip`，解压后运行 `catskit.exe`
              - ⚠️ Windows 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+（安装时勾选 **Add to PATH**）
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 📱 iOS（未签名 IPA）
              - 下载 `CatsKit-ios-*.ipa`，使用 TrollStore / SideStore / 轻松签等工具安装
              - ⚠️ 未签名 IPA 无法直接安装到未越狱设备，需自签（Apple ID 7 天有效）或使用
                TrollStore（永久）
              - 详细安装方法见项目 README「未签名应用安装指南」

              ### 🐧 Linux 桌面版
              - 下载 `CatsKit-linux-x64-*.tar.gz`，解压后执行 `./catskit`
              - 需要 x86_64 架构（glibc 2.35+，如 Ubuntu 22.04 及以上）与 GTK3 运行库：
                `sudo apt install libgtk-3-0 liblzma5`
              - ⚠️ Linux 版的 OCR 识别依赖 Python，首次使用需：
                - 安装 Python 3.8+
                - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

              ### 🔧 系统要求
              - Android 5.0 及以上
              - Windows 10 / 11（64 位）
              - Linux（x86_64，glibc 2.35+，需 GTK3）
              - iOS 15.5 及以上
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}