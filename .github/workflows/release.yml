name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
      
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/catskit_keystore.jks
      
      - name: Create signing config
        run: |
          # local.properties 只保留 SDK 路径
          cat > android/local.properties << EOF
          flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.44.1-x64
          sdk.dir=/usr/local/lib/android/sdk
          EOF
          # 签名密码通过 GitHub Secrets 写入 key.properties（该文件不会提交）
          cat > android/key.properties << EOF
          storeFile=catskit_keystore.jks
          keyAlias=catskit_alias
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --split-per-abi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ================= Windows 桌面版构建 =================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Get version info
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "CatsKit-windows-${{ steps.version.outputs.TAG }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: CatsKit-windows-*.zip
          if-no-files-found: error

  # ================= iOS 未签名 IPA 构建 =================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      # macOS 自带 CocoaPods；若缺失则安装，保证 pod install 可用
      - name: Ensure CocoaPods
        run: |
          pod --version >/dev/null 2>&1 || sudo gem install cocoapods --no-document

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package unsigned IPA
        run: |
          # 未签名 IPA 结构：Payload/Runner.app 打包为 zip
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r "CatsKit-ios-${{ steps.version.outputs.TAG }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CatsKit-ios-*.ipa
          if-no-files-found: error

  # ================= 统一发布 Release（等待 Android + Windows + iOS 构建完成） =================
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Get version info
        id: version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "CatsKit ${{ steps.version.outputs.TAG }}"
          prerelease: false
          body: |
            ## 正式版 - ${{ steps.version.outputs.TAG }}
              - 发布日期：${{ steps.version.outputs.DATE }}
              
              ### 新功能
              - 无

              ### 修复与调整
              - 国际服铁娘子增强
              - 调整部分UI
              - 🐽
            
            ### 📱 Android 下载安装
            | 文件 | 适用设备 |
            |------|---------|
            | `app-arm64-v8a-release.apk` | 主流手机（推荐） |
            | `app-armeabi-v7a-release.apk` | 老旧设备 |
            | `app-x86_64-release.apk` | 模拟器 |
            
            ### 🖥️ Windows 桌面版
            - 下载 `CatsKit-windows-*.zip`，解压后运行 `catskit.exe`
            - ⚠️ Windows 版的 OCR 识别依赖 Python，首次使用需：
              - 安装 Python 3.8+（安装时勾选 **Add to PATH**）
              - 在终端执行：`pip install rapidocr-onnxruntime opencv-python numpy`

            ### 📱 iOS（未签名 IPA）
            - 下载 `CatsKit-ios-*.ipa`，使用 TrollStore / SideStore / 轻松签 等工具安装
            - ⚠️ 未签名 IPA 无法直接安装到未越狱设备，需自签（Apple ID 7 天有效）或使用 TrollStore（永久）
            - 详细安装方法见项目 README「未签名应用安装指南」

            ### 🔧 系统要求
            - Android 5.0 及以上
            - Windows 10 / 11（64 位）
            - iOS 15.5 及以上
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}